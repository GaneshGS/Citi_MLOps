[build-system]
requires = ["setuptools==80.9.0", "setuptools-scm==9.2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unsloth"
dynamic = ["version"]
description = "2-5X faster training, reinforcement learning & finetuning"
readme = "README.md"
requires-python = ">=3.9,<3.15"
license = "Apache-2.0"
keywords = ["ai", "llm", "reinforcement learning", "machine learning", "artificial intelligence", "pytorch"]
authors = [
    {email = "info@unsloth.ai"},
    {name = "Unsloth AI team"},
]
maintainers = [
    {name = "Daniel Han", email = "daniel@unsloth.ai"},
    {name = "Michael Han", email = "info@unsloth.ai"},
]
classifiers = [
    "Programming Language :: Python",
    "Environment :: GPU",
    "Environment :: GPU :: NVIDIA CUDA",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer",
    "pydantic",
    "pyyaml",
    "nest-asyncio",
]

[project.scripts]
unsloth = "unsloth_cli:app"

[tool.setuptools.dynamic]
version = {attr = "unsloth._version.__version__"}

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
studio = [
    "*.sh",
    "*.ps1",
    "*.bat",
    "frontend/dist/**/*",
    "frontend/*.json",
    "frontend/*.ts",
    "frontend/*.js",
    "frontend/*.html",
    "frontend/*.yaml",
    "frontend/.git*",
    "backend/requirements/**/*",
    "backend/core/data_recipe/oxc-validator/*.json",
    "backend/core/data_recipe/oxc-validator/*.mjs",
]

[tool.setuptools.packages.find]
include = ["unsloth*", "unsloth_cli*", "studio", "studio.backend*"]
exclude = ["images*", "tests*", "*.node_modules", "*.node_modules.*"]

[project.optional-dependencies]
# Studio-centric fork: upstream CUDA/ROCm/Intel/xFormers optional matrices
# were removed. Default `pip install -e .` stays minimal (see [project].dependencies).
# For the FastAPI Studio stack, use either:
#   pip install -e ".[studio]"
# or: pip install -r studio/backend/requirements/studio.txt

studio = [
    "fastapi",
    "uvicorn[standard]",
    "matplotlib",
    "pandas",
    "datasets==4.3.0",
    "pyjwt",
    "easydict",
    "addict",
    "huggingface-hub==0.36.2",
    "structlog>=24.1.0",
    "diceware",
    "ddgs",
]

dev = [
    "pytest>=8,<9",
]

[project.urls]
homepage = "https://unsloth.ai"
documentation = "https://unsloth.ai/docs"
repository = "https://github.com/unslothai/unsloth"

[tool.ruff]
target-version = "py311"
force-exclude = true
extend-exclude = [
    "*chat_templates.py",
    "*ollama_template_mappers.py",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
ignore = [
    "E402",
    "E722",
    "F403",
    "F405",
    "F811",
    "F821",
    "F841",
    "F401",
    "E731",
    "E741",
    "F601",
    "E712",
]

[tool.ruff.format]
